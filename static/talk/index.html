<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta id="theme-color" name="theme-color" content="#30302e">
<title>Hermes Telegram Talk</title>
<link rel="stylesheet" href="app.css?v=bdcc82f808ee84c8">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="app.js?v=0d7b9ae70355e263" defer></script>
</head>
<body>
<main>
  <ol id="transcript" aria-label="Transcript" aria-live="polite" tabindex="0" hidden></ol>
  <div class="actions">
    <p id="call-status" role="status">Connecting</p>
    <p id="error" role="alert" hidden></p>
    <button id="start" type="button" hidden>Tap to start</button>
    <div class="control-row">
      <button id="menu-toggle" type="button" aria-label="Call settings" aria-expanded="false" aria-controls="call-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="4" stroke-linecap="round"/></svg></button>
      <section id="call-menu" aria-labelledby="menu-title" tabindex="-1" hidden>
        <div class="menu-heading"><h3 id="menu-title">Call settings</h3><button id="menu-close" type="button" aria-label="Close call settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
        <div id="voice-box" class="menu-section" hidden>
          <label for="voice">Reply voice</label>
          <select id="voice" aria-describedby="catalogue-note voice-note"></select>
          <p id="catalogue-note" class="note">Availability varies by account.</p>
          <p id="voice-note" class="note" hidden>The new voice starts after Reconnect.</p>
          <button id="reconnect" type="button" hidden>Reconnect</button>
        </div>
        <fieldset class="menu-section theme-choice">
          <legend>Theme</legend>
          <div class="theme-options">
            <label><input type="radio" name="theme" id="theme-modern" value="modern" checked>Modern</label>
            <label><input type="radio" name="theme" id="theme-typesafe" value="typesafe">Retro 95</label>
          </div>
        </fieldset>
        <div class="menu-footer"><button id="end" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-4c4-4 12-4 16 0v4h-5v-3H9v3Z"/></svg>End call</button></div>
      </section>
      <section class="presence" aria-label="Voice conversation">
        <div id="orb" data-state="connecting" role="img" aria-label="Connecting. Microphone paused.">
          <canvas id="ring" width="640" height="640" aria-hidden="true"></canvas>
          <div class="portrait">
            <svg id="face" viewBox="0 0 160 160" aria-hidden="true"><rect width="160" height="160" rx="80" fill="#252f32"/><path d="M42 91c0-41 12-59 38-59s38 18 38 59c0 27-18 45-38 45S42 118 42 91" fill="#becbc4"/><path d="M43 72c-4-34 21-49 42-45 26-1 39 20 33 49l-13-25c-20 10-36 13-62 21" fill="#657e76"/><path d="M58 84h8m28 0h8" stroke="#253b35" stroke-width="5" stroke-linecap="round"/><path d="M70 109q10 8 20 0" fill="none" stroke="#253b35" stroke-width="3" stroke-linecap="round"/></svg>
            <img id="avatar" alt="" hidden referrerpolicy="no-referrer">
          </div>
          <span class="state-mark" aria-hidden="true"></span>
        </div>
        <h2 id="name">Hermes</h2>
      </section>
      <button id="mute" type="button" aria-pressed="false" aria-label="Mute microphone" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3m-4 0h8"/></svg><span>Mute</span></button>
    </div>
  </div>
</main>
<audio id="remote" autoplay playsinline></audio>
</body>
</html>
