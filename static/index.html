<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pewds voice test</title>
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main>
  <h1>Pewds voice test</h1>
  <p id="error" role="alert" hidden></p>
  <div class="controls">
    <button id="start" type="button" class="primary">Start</button>
    <button id="mute" type="button" aria-pressed="false" disabled>Mute</button>
    <button id="end" type="button" class="danger" disabled>End</button>
  </div>
</main>
<audio id="remote" autoplay playsinline></audio>
</body>
</html>
