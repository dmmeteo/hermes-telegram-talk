# Hermes Telegram Talk configuration example. Copy next to the profile (not into this repo) and edit.
# Every value here is public. Secrets never go in this file: the bot token and allowlist come from
# TG_VOICE_BOT_TOKEN / TG_VOICE_ALLOWED_USER_IDS, and GPT-Live credentials from the profile's Codex sign-in.
profile:
  id: pewds                  # must equal the HERMES_HOME profile ("default" for ~/.hermes)
  display_name: Pewds
  # avatar: avatar.png       # local .svg/.png/.jpg relative to this file; URLs are refused. Default: neutral SVG.
appearance:
  listen_color: "#4FC3F7"
  speak_color: "#FFB74D"
voice:
  model: gpt-live-1-codex
  voice: cove
  language: uk               # en or uk: the call speaks and opens in this language (instruction text only;
                             # the GPT-Live session has no language field)
  # language_hint: "..."     # optional extra language guidance, added after the language rule
  session_ttl_minutes: 120   # an unended call is marked expired after this; the conversation itself never resets
# persona:                   # the voice persona; Talk does not read the profile's SOUL.md
#   text: "Calm, warm and to the point. Dry humour is welcome; never chatty."  # up to 1200 characters;
#                            # default: a calm and friendly voice assistant
#   self_reference: feminine # Ukrainian feminine forms for herself: «я готова», «я зрозуміла»
greeting:
  enabled: true              # false: the voice waits for the user to speak first
  text: "Greet the user in one short sentence."  # used only without phrases and without voice.language
  # phrases:                 # optional ready opening lines; one per call, chosen locally. Without them the call
  #   - "Привіт! Я на зв’язку. Що робимо?"   # opens with the language's own line («Привіт! Я на зв’язку. Слухаю.»)
context:
  skills: []                 # allowlist of skill names read through the host skill loader; empty = none
  budgets:                   # application character limits, not provider tokens
    instructions_chars: 12000
    skill_chars: 1500
    skills_chars: 3000
    summary_chars: 2000      # the earlier conversation's summary; its latest turns go word for word as initial_items
    recent_turns: 8          # voice turns carried into a delegated task's prompt
    turn_chars: 300
    activity_items: 5
    activity_chars: 1200
    event_batch_max: 20
    event_text_chars: 2000
activity:
  enabled: true
  window_hours: 168          # first visit looks back this far; later visits start at the read cursor
  sources: [cli, telegram, discord, cron, kanban, desktop]
  # owner_user_id: 123456789 # numeric Telegram id of the operator; only this user hears sessions with no
  #                          # chat user (CLI, cron, kanban). Omit it and those sessions are never briefed.
tasks:
  enabled: false             # voice delegations become native Hermes tasks only when true
  # user_ids: [123456789]    # required when enabled: Telegram ids allowed to start tasks
  # toolsets: [file, web, session_search]   # required when enabled: Hermes toolsets a task may use
  # workdir: .               # the task's working directory, relative to this file
  # max_concurrent: 3        # any positive integer; turns at once across the profile; waiting tasks are not capped, and a task
  #                          # that handed work to T3 holds no slot (Talk follows the T3 thread)
  # run_budget_seconds: 600  # Hermes' own run budget; Talk stops the run 60 s after it
  # max_turns: 30
  # request_chars: 2000
  # result_chars: 1500
receipts:                    # with tasks on, each task keeps one status message (title and state, no result)
  enabled: true              # in the user's own private chat with the Talk bot, even after the call ended
  # attempts: 3              # sends that provably did not leave (refused, rate limited) and edits retry this often
  # large_work: true         # default: tasks T3 admitted work from get a status message
  # micro_tasks: false       # default: every other task gets none; each user switches both with /talk_notify
  # destinations:            # explicit alternatives the user may name with "REPORT TO: <name>"
  #   ops:
  #     target: "telegram:-1001234567890:17"   # telegram:<chat id>[:<topic id>] the Talk bot can post to
  #     user_ids: [123456789]                  # task users allowed to choose it
privacy:
  persist_audio: false       # the only accepted value; raw audio is never stored
